[project]
name = "lchain-agent"
version = "0.1.0"
description = "LangChain AI Agent 框架 + Langfuse 可观测 / 提示词管理"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "langfuse>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "ddgs>=9.0",
    "trafilatura>=2.0",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2",
    "pymysql>=1.1,<1.2",
    "cryptography>=42",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "langgraph-checkpoint-mysql[aiomysql]>=3.0",
]
