<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f4f7" />
  <title>就医规划</title>
  <link rel="stylesheet" href="/static/style.css?v=2" />
  <link rel="stylesheet" href="/static/plan-card.css?v=2" />
  <script src="/static/icons.js?v=2"></script>
  <script src="/static/common.js?v=2"></script>
  <script src="/static/plan-card.js?v=2"></script>
  <style>
    /* 患者端 H5：浅色底、白卡片，适配微信内置浏览器与全面屏安全区 */
    html, body { background: #f2f4f7; background-image: none; color: #1f2937; }
    body { min-height: 100vh; }
    .pc-page {
      max-width: 560px; margin: 0 auto;
      padding: calc(14px + env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom));
    }
    .pc-page-head {
      display: flex; align-items: center; gap: 7px; margin: 0 2px 12px;
      color: #475467; font-size: 13px;
    }
    .pc-page-head b { color: #101828; font-size: 15px; font-weight: 600; }
    .pc-page-head .who { margin-left: auto; color: #98a2b3; font-size: 12px; }
    .pc-page-tip { margin: 14px 2px 0; color: #98a2b3; font-size: 12px; line-height: 1.6; }
    .pc-skeleton {
      height: 240px; border-radius: 14px;
      background: linear-gradient(90deg, #e9ecf1 25%, #f5f6f8 37%, #e9ecf1 63%);
      background-size: 400% 100%; animation: pc-skeleton 1.3s ease infinite;
    }
    @keyframes pc-skeleton { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
    .pc-fail { padding: 64px 20px; text-align: center; color: #667085; font-size: 14px; }
    @media (prefers-reduced-motion: reduce) { .pc-skeleton { animation: none; } }
  </style>
</head>
<body>
<main class="pc-page">
  <div class="pc-page-head">
    <i class="ic" data-icon="stethoscope" data-size="18"></i>
    <b>就医规划</b>
    <span class="who" id="who"></span>
  </div>
  <div id="card"><div class="pc-skeleton"></div></div>
  <p class="pc-page-tip">本页展示当前有效的就医规划；如有更新，以群里最新一条为准。症状变化请随时在群里说。</p>
</main>

<script>
  const mid = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
  api(`/api/wecom/messages/${encodeURIComponent(mid)}`).then((m) => {
    const extra = m.extra || {};
    if (m.msg_type !== "plan_card" || !extra.view || !Object.keys(extra.view).length) {
      $("#card").innerHTML = '<div class="pc-fail">没有找到这条就医规划，请在群里查看最新消息。</div>';
      return;
    }
    $("#who").textContent = m.sender_name || "";
    $("#card").innerHTML = planCardHTML(extra, m.content);
  }).catch(() => {
    $("#card").innerHTML = '<div class="pc-fail">加载失败，请稍后重试，或在群里查看最新消息。</div>';
  });
</script>
</body>
</html>
