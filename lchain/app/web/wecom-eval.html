<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LChain Agent · 企微群回复评测</title>
  <link rel="stylesheet" href="/static/style.css?v=3" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="/static/icons.js?v=3"></script>
  <style>
    .set-picker > summary { cursor: pointer; padding: 4px 8px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--panel); list-style: none; font-size: 12px; }
    .set-picker > summary::-webkit-details-marker { display: none; }
    .set-picker > summary::before { content: "▸ "; color: var(--muted); }
    .set-picker[open] > summary::before { content: "▾ "; }
    .set-picker > summary b { color: var(--primary); }
    .set-list { max-height: 260px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px;
      margin-top: 4px; padding: 6px; background: var(--panel); }
    .set-opt { display: flex; align-items: center; gap: 6px; margin: 0; padding: 3px 4px; cursor: pointer;
      font-size: 12px; color: var(--text); }
    .set-opt input { width: auto; accent-color: var(--primary); }
    .set-opt span:first-of-type { flex: 1; }
    .ev { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
    .ev .main { overflow-y: auto; padding: 18px 22px; }
    .ev .topbar { padding: 10px 22px; }
    .rep-item { padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; margin-bottom: 4px; }
    .rep-item:hover { background: var(--panel2); border-color: var(--border); }
    .rep-item.cur { border-color: var(--primary); background: var(--panel2); }
    .rep-item .t { font-size: 13px; }
    .rep-item .m { font-size: 11px; color: var(--muted); }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0; }
    .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
    .stat b { display: block; font-size: 20px; margin-bottom: 2px; }
    .stat span { font-size: 11px; color: var(--muted); }
    table.cases { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    table.cases th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 8px;
      border-bottom: 1px solid var(--border); }
    table.cases td { padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    table.cases tr.bad td { background: #2a1a1a; }
    .ok { color: var(--ok); } .bad { color: var(--err); }
    .case-detail { font-size: 12px; color: var(--muted); }
    .case-detail pre { white-space: pre-wrap; background: #0b0d12; padding: 8px; border-radius: 6px; max-height: 320px; overflow: auto; }
    .bubble { margin: 4px 0; padding: 6px 10px; border-radius: 8px; background: var(--panel2); }
    .bubble.p { background: #1f2640; }
    .bubble.a { background: #173328; }
    .ai-box { border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-top: 10px;
      background: var(--panel); font-size: 13px; line-height: 1.7; }
    .ai-box h2 { font-size: 14px; margin: 12px 0 6px; }
    .bar { height: 8px; border-radius: 4px; background: var(--panel2); overflow: hidden; margin: 6px 0 2px; }
    .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), var(--ok)); }
  </style>
</head>
<body>
<div class="app ev">
  <aside class="sidebar">
    <h1><i class="ic" data-icon="chart"></i>LChain Agent</h1>
    <div class="brand-sub">企微群回复评测</div>
    <div class="nav">
      <a href="/"><i class="ic" data-icon="chat"></i>对话</a>
      <a href="/?scenario=consult"><i class="ic" data-icon="stethoscope"></i>问诊</a>
      <a href="/wecom"><i class="ic" data-icon="users"></i>企微群</a>
      <a href="/wecom-eval" class="active"><i class="ic" data-icon="chart"></i>企微评测</a>
      <a href="/eval"><i class="ic" data-icon="chart"></i>问诊评测</a>
    </div>

    <div class="section">
      <div class="section-title"><i class="ic" data-icon="history"></i>历史报告</div>
      <div class="muted" id="repCount"></div>
      <div id="repList" style="margin-top:8px"><div class="muted">加载中…</div></div>
    </div>

    <div class="section">
      <div class="section-title"><i class="ic" data-icon="fileText"></i>用例</div>
      <div class="muted">用例文件在 <code>eval/wecom/&lt;场景&gt;/&lt;序号-描述&gt;.md</code>，<b>目录 = 测试集合</b>，改完刷新本页即可。</div>
      <div class="muted" style="margin-top:6px">校验用例格式：<br><code>PYTHONPATH=. .venv/bin/python -m app.wecom.cases</code></div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div><b>企微群回复批量评测</b> <span class="muted" id="meta"></span></div>
      <div class="row">
        <details class="set-picker" id="setPicker" style="width:300px">
          <summary>测试集合：<b id="setLabel">全部</b></summary>
          <div class="set-pop">
            <div class="set-list" id="setList"></div>
            <div class="row" style="margin-top:6px"><button id="setAll" class="sm">全选</button><button id="setNone" class="sm">清空</button></div>
          </div>
        </details>
        <label class="row muted" style="margin:0">数量
          <select id="limit" style="width:auto">
            <option value="3">前 3 条</option>
            <option value="5">前 5 条</option>
            <option value="0">全部</option>
          </select></label>
        <button id="run" class="primary"><i class="ic" data-icon="play"></i>开始批量评测</button>
        <button id="cancel" class="danger" style="display:none"><i class="ic" data-icon="stop"></i>取消</button>
        <button id="refresh" class="icon-btn" title="刷新"><i class="ic" data-icon="refresh"></i></button>
      </div>
    </div>
    <div id="body">
      <div class="empty">
        <div class="empty-ic"><i class="ic" data-icon="listChecks"></i></div>
        <h2>选一份报告看结果</h2>
        <div>或点右上「开始批量评测」：每条用例会新开一个临时群跑真实一轮（消息不外发），跑完自动删除，报告留在服务端</div>
      </div>
    </div>
  </main>
</div>

<script src="/static/common.js?v=3"></script>
<script>
let repId = null;

// 判定项英文 key → 中文名（与后端 app/wecom/eval.py::CHECKS 对应）
const CHECK = { intent: "回复分支", reply: "是否回复", card: "推卡片", notify: "紧急通知", mention: "@病历经理",
  keywords: "关键词/禁用词", length: "字数", guide: "引导语", merged: "合并回复" };

function pct(v) { return `${v ?? 0}%`; }

let sets = [], picked = new Set(["all"]);

function renderSets() {
  $("#setList").innerHTML = sets.filter((s) => s.key !== "all").map((s) => `<label class="set-opt">
      <input type="checkbox" data-key="${esc(s.key)}" ${picked.has(s.key) ? "checked" : ""} />
      <span>${esc(s.label)}</span><span class="muted">${s.count} 条</span></label>`).join("");
  $("#setList").querySelectorAll("input[data-key]").forEach((ck) => (ck.onchange = () => {
    const key = ck.dataset.key;
    if (ck.checked) { picked.delete("all"); picked.add(key); } else picked.delete(key);
    if (!picked.size) picked = new Set(["all"]);
    localStorage.setItem("wecomEvalSets", JSON.stringify([...picked]));
    renderSets();
  }));
  const sel = sets.filter((s) => picked.has(s.key));
  const all = picked.has("all") || !sel.length;
  const count = sets.reduce((n, s) => n + (all || picked.has(s.key) ? s.count : 0), 0);
  $("#setLabel").textContent = (all ? "全部" : sel.map((s) => s.label).join("、")) + `（${count} 条）`;
}

async function loadSets() {
  try {
    const r = await api("/api/wecom/evals/sets");
    sets = r.sets || [];
    const saved = JSON.parse(localStorage.getItem("wecomEvalSets") || '["all"]');
    picked = new Set(Array.isArray(saved) && saved.length ? saved : ["all"]);
    renderSets();
  } catch { /* 拉不到就按全部 */ }
}

async function loadReports() {
  try {
    const r = await api("/api/wecom/evals?limit=50");
    const rows = r.evals || [];
    $("#repCount").textContent = `共 ${rows.length} 份`;
    $("#repList").innerHTML = rows.length ? rows.map((e) => `
      <div class="rep-item ${e.id === repId ? "cur" : ""}" data-id="${esc(e.id)}">
        <div class="t">${esc(e.created_at)}</div>
        <div class="m"><span class="${e.passed === e.total ? "ok" : "bad"}">${e.passed}/${e.total} 通过</span>
          · ${esc(e.set_label || "")} · ${Math.round((e.duration_ms || 0) / 1000)}s${e.has_analysis ? " · 已分析" : ""}</div>
      </div>`).join("") : '<div class="muted" style="padding:8px">还没有报告</div>';
    $("#repList").querySelectorAll(".rep-item").forEach((el) => (el.onclick = () => openReport(el.dataset.id)));
  } catch (e) {
    $("#repList").innerHTML = `<div class="muted">加载失败：${esc(e.message)}</div>`;
  }
}

async function openReport(id) {
  repId = id;
  $("#body").innerHTML = '<div class="muted">载入…</div>';
  const r = await api(`/api/wecom/evals/${id}`);
  renderReport(r);
  loadReports();
}

function expectLabel(c) {
  const e = c.expect || {};
  if (e.intent) return e.intent;
  if (e.intent_any && e.intent_any.length) return e.intent_any.join(" / ");
  if (e.need_reply === false) return "无需回复";
  return "-";
}

function renderReport(r) {
  const st = r.stats || {};
  const byCheck = (st.by_check || {});
  const rows = (r.cases || []).map((c, i) => {
    const bad = Object.entries(c.checks || {}).filter(([, v]) => !v).map(([k]) => CHECK[k] || k);
    const replies = (c.replies || []).join(" / ");
    return `<tr class="${c.passed ? "" : "bad"}">
      <td class="${c.passed ? "ok" : "bad"}">${c.passed ? icon("checkCircle") : icon("xCircle")}</td>
      <td><a href="#" data-case="${i}"><b>${esc(c.name)}</b></a>
        <div class="muted">${esc(c.message || "")}${c.followup ? ` + ${esc(c.followup)}` : ""}</div>
        <div class="muted"><code>${esc(c.source || "")}</code></div></td>
      <td>${esc(c.route || "-")}<div class="muted">期望 ${esc(expectLabel(c))}</div></td>
      <td>${c.card ? "是" : "否"}<div class="muted">${(c.expect || {}).push_card === undefined ? "不校验" : "期望 " + (c.expect.push_card ? "是" : "否")}</div></td>
      <td>${c.mention_manager || c.notify ? "已转" : "未转"}<div class="muted">${Object.keys(c.expect || {}).some((k) => ["notify_manager", "mention_manager"].includes(k)) ? "期望 " + (((c.expect || {}).mention_manager || (c.expect || {}).notify_manager) ? "转" : "不转") : "不校验"}</div></td>
      <td>${(c.reply_chars || [])[0] || 0}<div class="muted">上限 ${(c.expect || {}).max_chars || "-"}</div></td>
      <td>${Math.round((c.duration_ms || 0) / 1000)}s</td>
      <td class="case-detail">${bad.length
        ? `<span class="bad">${esc(bad.join("、"))}</span><br>${esc((c.notes || []).join("；"))}`
        : c.passed ? '<span class="ok">全部通过</span>' : `<span class="bad">执行异常</span><br>${esc(String(c.error || (c.notes || [])[0] || "").slice(0, 180))}`}
        <div class="muted" style="margin-top:4px">回复：${esc(replies || "（无）").slice(0, 120)}</div></td>
    </tr>
    <tr id="case-${i}" style="display:none"><td colspan="8"></td></tr>`;
  }).join("");

  $("#body").innerHTML = `
    <div class="cards">
      <div class="stat"><b class="${r.passed === r.total ? "ok" : "bad"}">${r.passed}/${r.total}</b><span>通过</span></div>
      <div class="stat"><b>${pct(st.pass_rate)}</b><span>通过率</span><div class="bar"><i style="width:${st.pass_rate || 0}%"></i></div></div>
      <div class="stat"><b>${st.avg_reply_chars ?? "-"}</b><span>平均字数（最长 ${st.max_reply_chars ?? "-"}）</span></div>
      <div class="stat"><b>${st.avg_reply_count ?? "-"}</b><span>平均回复条数</span></div>
      <div class="stat"><b>${Math.round((st.avg_duration_ms || 0) / 1000)}s</b><span>平均耗时 · ${esc(r.model || "")}</span></div>
      <div class="stat"><b>${Math.round((r.duration_ms || 0) / 1000)}s</b><span>整轮耗时 · ${esc(r.set_label || "")}</span></div>
    </div>
    <div class="muted">分项通过率：${Object.entries(byCheck).map(([k, v]) => `${CHECK[k] || k} ${v.total ? v.pct + "%（" + v.ok + "/" + v.total + "）" : "不适用"}`).join(" · ")}</div>
    <table class="cases">
      <thead><tr><th></th><th>用例</th><th>回复分支</th><th>卡片</th><th>转人工</th><th>字数</th><th>耗时</th><th>结果</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="row" style="margin-top:14px">
      <button id="ai" class="primary">${r.analysis ? `${icon("refresh")}重新 AI 分析` : `${icon("brain")}AI 分析（DeepSeek）`}</button>
      <span class="muted">让 DeepSeek 读这份报告，给出失败归因与改进建议</span>
    </div>
    <div id="aiBox">${r.analysis ? `<div class="ai-box">${md(r.analysis.text)}<div class="muted" style="margin-top:8px">分析时间：${esc(r.analysis.at || "")}</div></div>` : ""}</div>`;

  $("#ai").onclick = () => analyze(repId);
  $("#body").querySelectorAll("a[data-case]").forEach((a) => (a.onclick = (ev) => {
    ev.preventDefault();
    toggleCase(Number(a.dataset.case), r.cases[Number(a.dataset.case)]);
  }));
}

function toggleCase(i, c) {
  const tr = $(`#case-${i}`);
  if (tr.style.display !== "none") { tr.style.display = "none"; return; }
  const bubbles = (c.transcript || []).map((t) => `<div class="bubble ${t.role === "patient" ? "p" : "a"}">
      <b>${t.role === "patient" ? "患者" : t.role === "card" ? "卡片" : "助手"}：</b>${esc(t.content)}</div>`).join("");
  const steps = (c.steps || []).map((s) => `<details class="step"><summary><b>${esc(s.node || "")}</b> ${esc(s.title || "")}
      <span class="muted">${s.ms != null ? s.ms + "ms" : ""}</span></summary>
      <pre>${esc(typeof s.data === "string" ? s.data : JSON.stringify(s.data, null, 2))}</pre></details>`).join("");
  tr.querySelector("td").innerHTML = `<div class="case-detail">
    <div class="row muted" style="margin-bottom:6px">判定要点：${esc(c.notes_hint || "（无）")}</div>
    ${bubbles || "（没有消息记录）"}
    <div style="margin-top:8px" class="muted">节点步骤（${(c.steps || []).length}）</div>
    <pre>${esc((c.guides || []).length ? "引导语：" + (c.guides || []).join(" / ") : "")}</pre>
    ${steps}</div>`;
  tr.style.display = "";
}

async function analyze(id) {
  const btn = $("#ai");
  btn.disabled = true; btn.textContent = "分析中…";
  $("#aiBox").innerHTML = '<div class="ai-box muted">DeepSeek 正在读这份报告…</div>';
  try {
    const a = await api(`/api/wecom/evals/${id}/analyze`, { method: "POST" });
    $("#aiBox").innerHTML = `<div class="ai-box">${md(a.text)}<div class="muted" style="margin-top:8px">分析时间：${esc(a.at || "")}</div></div>`;
  } catch (e) {
    $("#aiBox").innerHTML = `<div class="ai-box bad">分析失败：${esc(e.message)}</div>`;
  } finally { btn.disabled = false; btn.textContent = "重新 AI 分析"; loadReports(); }
}

// 跑批：任务在服务端后台跑（刷新页面不中断），这里只发起 + 轮询状态
let runTimer = null, myRunId = null, openedRun = null;

async function runEval() {
  const limit = Number($("#limit").value) || 0;
  const keys = [...picked];
  const label = $("#setLabel").textContent;
  if (!confirm(`开始批量评测：${label}${limit ? `（只跑前 ${limit} 条）` : "（全部）"}\n\n每条用例会新建一个临时群跑真实一轮（消息不外发），跑完删除；任务在服务端后台跑，刷新页面不中断。开始？`)) return;
  const btn = $("#run");
  btn.disabled = true; btn.innerHTML = `${icon("loader", { cls: "spin" })}启动中…`;
  try {
    const s = await api(`/api/wecom/evals/run?sets=${encodeURIComponent(keys.join(","))}&limit=${limit}`, { method: "POST" });
    myRunId = s.id; openedRun = null;
  } catch (e) {
    alert("启动失败：" + e.message);
    btn.disabled = false; btn.innerHTML = `${icon("play")}开始批量评测`;
    return;
  }
  await pollRun();
}

function renderRun(s) {
  const head = s.status === "running"
    ? `${icon("loader", { cls: "spin" })} ${esc(s.sets)} · ${s.done}/${s.total}${s.current ? ` · 正在跑：${esc(s.current)}` : ""} · ${Math.round(s.elapsed_ms / 1000)}s`
    : `${s.status === "done" ? `${icon("checkCircle")} 完成` : s.status === "cancelled" ? `${icon("stop")} 已取消` : `${icon("xCircle")} 失败`}：${esc(s.sets)} · ${s.done}/${s.total} · ${Math.round(s.elapsed_ms / 1000)}s`;
  $("#body").innerHTML = `<pre style="background:var(--bg);border:1px solid var(--border);padding:14px 16px;border-radius:var(--r);white-space:pre-wrap"><b>${head}</b>\n${esc((s.lines || []).join("\n"))}</pre>`;
}

async function pollRun() {
  let s;
  try { s = await api("/api/wecom/evals/run/status"); } catch { return; }
  if (s.status === "idle") {
    if (runTimer) { clearInterval(runTimer); runTimer = null; }
    if (!repId) $("#body").innerHTML = `<div class="empty"><div class="empty-ic">${icon("listChecks")}</div><h2>选一份报告看结果</h2><div>或点右上「开始批量评测」</div></div>`;
    return;
  }
  renderRun(s);
  const running = s.status === "running";
  $("#run").disabled = running;
  $("#run").innerHTML = running ? `${icon("loader", { cls: "spin" })}评测中…` : `${icon("play")}开始批量评测`;
  $("#cancel").style.display = running ? "" : "none";
  if (running && !runTimer) runTimer = setInterval(pollRun, 1500);
  if (!running && runTimer) { clearInterval(runTimer); runTimer = null; }
  if (!running) {
    await loadReports();
    if (s.report_id && s.id === myRunId && openedRun !== s.id) { openedRun = s.id; openReport(s.report_id); }
  }
}

async function cancelRun() {
  if (!confirm("取消本次评测？已跑完的用例会保留，但本轮不会生成完整报告。")) return;
  await api("/api/wecom/evals/run/cancel", { method: "POST" }).catch(() => {});
  await pollRun();
}

$("#run").onclick = runEval;
$("#cancel").onclick = cancelRun;
$("#setAll").onclick = () => { picked = new Set(sets.filter((s) => s.key !== "all").map((s) => s.key)); localStorage.setItem("wecomEvalSets", JSON.stringify([...picked])); renderSets(); };
$("#setNone").onclick = () => { picked = new Set(["all"]); localStorage.setItem("wecomEvalSets", '["all"]'); renderSets(); };
$("#refresh").onclick = loadReports;
// 支持 /wecom-eval#<报告id> 直接打开某一份（企微群页面右侧概览就是跳这里）
loadSets().then(() => pollRun()).then(() => loadReports()).then(() => {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id) openReport(id);
});
</script>
</body>
</html>
