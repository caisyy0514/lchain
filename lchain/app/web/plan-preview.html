  <style>
    .pv-head { max-width: 1100px; margin: 0 auto 18px; }
    .pv-head h1 { margin: 0 0 4px; font-size: 20px; }
    .pv-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
    .pv-tabs button.on { border-color: var(--primary); color: #fff; background: linear-gradient(180deg, var(--primary) 0%, var(--primary2) 100%); }
    .pv-views { display: inline-flex; gap: 6px; margin-left: auto; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel2); }
    .pv-views button { border: none; background: transparent; padding: 5px 11px; font-size: 12.5px; color: var(--muted); }
    .pv-views button.on { background: var(--panel-hi); color: var(--text); border-radius: 7px; box-shadow: var(--sh-1); }
    .pv-toggle { display: inline-flex; align-items: center; gap: 7px; color: var(--text2); font-size: 12.5px; cursor: pointer; user-select: none; }
    .pv-toggle input { width: 15px; height: 15px; }

    /* 手机预览：贴近微信内置浏览器的真实宽度（390 / 360） */
    .pc-preview-stage[data-view="phone"] .pc-preview-chat,
    .pc-preview-stage[data-view="phone-sm"] .pc-preview-chat {
      flex: 0 0 390px; min-width: 0; max-width: 390px;
      padding: 12px 10px 18px; border-radius: 30px;
      border: 1px solid var(--border-strong);
      background: linear-gradient(180deg, #161a24 0%, #0f1219 100%);
      box-shadow: var(--sh-3), 0 0 0 7px #05070c;
    }
    .pc-preview-stage[data-view="phone-sm"] .pc-preview-chat { flex-basis: 360px; max-width: 360px; }
    .pc-preview-stage[data-view^="phone"] { justify-content: flex-start; }
    .pc-preview-device { font-size: 12px; color: var(--muted); margin-bottom: 10px; text-align: center; }
    @media (max-width: 480px) {
      .pc-preview-page { padding: 16px 10px 40px; }
      .pc-preview-stage[data-view^="phone"] .pc-preview-chat { flex-basis: 100%; max-width: 100%; box-shadow: var(--sh-2); }
      .pv-views { margin-left: 0; width: 100%; justify-content: space-between; }
    }

    /* 聊天预览（模拟企微群消息） */
    .pv-chat { display: flex; gap: 10px; margin-bottom: 18px; }
    .pv-chat .pv-av { width: 30px; height: 30px; flex: none; border-radius: 8px; display: flex; align-items: center; justify-content: center;
      background: var(--panel3); color: var(--text2); }
    .pv-chat .pv-col { min-width: 0; }
    .pv-chat .pv-who { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
    .pv-bubble { display: inline-block; max-width: 560px; padding: 9px 13px; border-radius: 10px; font-size: 13.5px; line-height: 1.7;
      background: var(--panel2); border: 1px solid var(--border); color: var(--text); }
    .pv-bubble.me { background: #1f2640; }
    .pv-chat.me { flex-direction: row-reverse; }
    .pv-chat.me .pv-col { text-align: right; }

    .pv-side { display: grid; gap: 12px; }
    .pv-side .panel { padding: 14px 15px; border: 1px solid var(--border); border-radius: 14px; background: var(--panel); }
    .pv-side h3 { margin: 0 0 8px; font-size: 13.5px; color: var(--text); }
    .pv-side p, .pv-side li { margin: 0; font-size: 12.5px; line-height: 1.75; color: var(--text2); }
    .pv-side ul { margin: 6px 0 0; padding-left: 18px; }
    .pv-side li + li { margin-top: 4px; }
    .pv-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .pv-legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text2); }
    .pv-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .pv-note { font-size: 12px; color: var(--muted); margin-top: 10px; }
  </style>
</head>

        </div>
      </div>

        <div class="pv-col">
          <div class="pv-who">家庭医生 · 助手</div>
          <div id="cardSlot"></div>
        </div>
      </div>
    </div>

    <aside class="pc-preview-side pv-side">
      <div class="panel">
        <h3 id="scName"></h3>
        <p id="scDesc"></p>
      </div>
      <div class="panel">
        <h3>设计要点</h3>
        <ul>
          <li>行动优先：首屏是分级徽标 + 一句建议 + 现在要做；</li>
          <li>安全不折叠：重要安全提醒始终可见、高对比；</li>
          <li>渐进披露：可能方向 / 需排除 / 为什么收进「判断依据」；</li>
          <li>颜色分级：顶部色条与徽标随紧急程度换色。</li>
        </ul>
        <div class="pv-legend">
          <span><i style="background:#d92d20"></i>立即急救</span>
          <span><i style="background:#dc6803"></i>当日就医</span>
          <span><i style="background:#1570cd"></i>计划门诊</span>
          <span><i style="background:#039855"></i>居家观察</span>
          <span><i style="background:#6938ef"></i>暂不能分级</span>
        </div>
        <label class="pv-toggle" style="margin:12px 0 0"><input type="checkbox" id="expandAll" /> 展开「判断依据」</label>
      </div>
    </aside>
  </div>
</div>

const params = new URLSearchParams(location.search);
const st = { key: SCENARIOS[0].key, open: params.get("open") === "1", view: params.get("view") || "phone" };
if (params.get("s") && SCENARIOS.some((x) => x.key === params.get("s"))) st.key = params.get("s");

function renderView() {
  $("#stage").dataset.view = st.view;
  const chatW = Math.round($(".pc-preview-chat").getBoundingClientRect().width);
  const dev = $(".pc-preview-device");
  if (dev) dev.textContent = st.view === "desktop" ? "桌面 / 平板" : `微信内置浏览器 · 可视宽 ${chatW}px`;
  $("#views").querySelectorAll("button").forEach((b) => {
    b.classList.toggle("on", b.dataset.view === st.view);
    b.onclick = () => { st.view = b.dataset.view; renderView(); };
  });
}
window.addEventListener("resize", renderView);

function renderTabs() {
  $("#tabs").innerHTML = SCENARIOS.map((s) =>
    `<button class="${s.key === st.key ? "on" : ""}" data-key="${s.key}">${esc(s.tab)}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach((b) => b.onclick = () => { st.key = b.dataset.key; render(); });
}

function render() {
  const sc = SCENARIOS.find((s) => s.key === st.key);
  $("#patientMsg").textContent = sc.patientMsg;
  $("#scName").textContent = sc.name;
  $("#scDesc").textContent = sc.desc;
  $("#cardSlot").innerHTML = planCardHTML(sc.extra, sc.extra.view.headline);
  $("#cardSlot").querySelectorAll("details").forEach((d) => { d.open = st.open; });
  $("#expandAll").checked = st.open;
  $("#expandAll").onchange = (e) => { st.open = e.target.checked; render(); };
  renderTabs();
}

renderView();
