<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LChain Agent · 对话</title>
  <link rel="stylesheet" href="/static/style.css?v=2" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="/static/icons.js?v=2"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1 id="appName"><i class="ic" data-icon="layers"></i>LChain Agent</h1>
    <div class="brand-sub">业务场景 Agent 开发框架</div>
    <div class="nav">
      <a href="/" id="navChat" class="active"><i class="ic" data-icon="chat"></i>对话</a>
      <a href="/?scenario=consult" id="navConsult"><i class="ic" data-icon="stethoscope"></i>问诊</a>
      <a href="/?scenario=rural" id="navRural"><i class="ic" data-icon="mountain"></i>山区问诊</a>
      <a href="/wecom"><i class="ic" data-icon="users"></i>企微群</a>
      <a href="/eval"><i class="ic" data-icon="chart"></i>测试</a>
    </div>

    <details class="section">
      <summary class="section-title"><i class="ic" data-icon="sliders"></i>模型<span class="chev"></span></summary>
      <label>模型</label><select id="model"></select>
      <label>温度 <span id="tempVal" class="muted"></span></label>
      <input id="temperature" type="range" min="0" max="2" step="0.1" />
      <label class="row"><input id="useTools" type="checkbox" checked /> <i class="ic" data-icon="cpu"></i>启用工具调用</label>
    </details>

    <details class="section">
      <summary class="section-title"><i class="ic" data-icon="globe"></i>联网 &amp; 技能<span class="chev"></span></summary>
      <label class="row"><input id="webSearch" type="checkbox" checked /> <i class="ic" data-icon="search"></i>联网搜索</label>
      <div class="muted" id="searchInfo"></div>
      <label class="row"><input id="useSkills" type="checkbox" checked /> <i class="ic" data-icon="sparkles"></i>启用 Skills</label>
      <div id="skillList" class="muted"></div>
    </details>

    <details class="section">
      <summary class="section-title"><i class="ic" data-icon="fileText"></i>提示词<span class="chev"></span></summary>
      <label>提示词名称（来自 Langfuse）</label><select id="promptName"></select>
      <label>版本 / Label</label><select id="promptVersion"></select>
      <label class="row"><input id="useOverride" type="checkbox" /> 使用下方临时提示词（不保存）</label>
      <textarea id="promptOverride" rows="9" placeholder="支持 {{assistant_name}} {{current_time}} {{language}} 变量"></textarea>
      <div class="row" style="margin-top:8px">
        <button id="loadPrompt"><i class="ic" data-icon="download"></i>载入当前版本</button>
        <button id="savePrompt" title="保存为 Langfuse 新版本"><i class="ic" data-icon="check"></i>保存为新版本</button>
      </div>
      <div id="promptInfo" class="muted" style="margin-top:6px"></div>
    </details>

    <div class="section">
      <div class="section-title"><i class="ic" data-icon="messageSquare"></i>会话</div>
      <div class="muted sid-line">session: <span id="sid"></span></div>
      <div class="row" style="margin-top:10px">
        <button id="newSession"><i class="ic" data-icon="plus"></i>新会话</button>
        <a id="sessionLink" target="_blank"><button><i class="ic" data-icon="external"></i>在 Langfuse 查看</button></a>
      </div>
      <div style="margin-top:12px" class="row"><span class="muted">Langfuse</span> <span id="lfStatus" class="badge">检测中</span></div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div><b id="sceneTitle">对话</b> <span class="muted" id="topMeta"></span> <span id="consultFlow" class="ppt-flow" style="display:none"></span> <span id="ruralFlow" class="ppt-flow" style="display:none"></span> <span id="pptFlow" class="ppt-flow" style="display:none"></span></div>
      <div class="row">
        <button id="toggleRight" title="会话历史 / 测试报告"><i class="ic" data-icon="history"></i>历史与报告</button>
        <a id="lfLink" target="_blank" class="muted"><i class="ic" data-icon="external"></i>Langfuse</a>
      </div>
    </div>
    <div class="messages" id="messages">
      <div class="empty" id="empty">
        <div class="empty-ic"><i class="ic" data-icon="sparkles"></i></div>
        <h2>有什么可以帮你？</h2>
        <div>每一轮对话都会在 Langfuse 中生成完整的执行明细（LLM 调用、工具调用、token、耗时）</div>
        <div class="chips">
          <button><i class="ic" data-icon="clock"></i>现在纽约几点了？</button>
          <button><i class="ic" data-icon="cpu"></i>帮我算一下 (1234 * 5678) / 3 的平方根</button>
          <button><i class="ic" data-icon="globe"></i>杭州今天天气怎么样，适合跑步吗？</button>
          <button><i class="ic" data-icon="bell"></i>今天 AI 领域有什么重要新闻？</button>
          <button><i class="ic" data-icon="search"></i>调研一下 LangGraph 和 CrewAI 的区别，给出参考来源</button>
          <button><i class="ic" data-icon="listChecks"></i>帮我做一个高血压居家管理的科普 PPT</button>
        </div>
      </div>
    </div>
    <div class="composer">
      <div class="box">
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <button class="primary" id="send" title="发送（Enter）"><i class="ic" data-icon="arrowUp"></i><span>发送</span></button>
      </div>
    </div>
  </main>

  <aside class="rightbar" id="rightbar">
    <div class="rb-head">
      <b><i class="ic" data-icon="history"></i>会话历史</b><span class="muted" id="histScope"></span>
      <button id="histSelect" class="sm" title="多选删除"><i class="ic" data-icon="checkSquare"></i>多选</button>
      <button id="histRefresh" class="icon-btn sm" title="刷新"><i class="ic" data-icon="refresh"></i></button>
    </div>
    <div class="rb-toolbar" id="histBar" style="display:none">
      <button id="histAll" class="sm">全选本页</button>
      <span class="muted" id="histCount">已选 0</span>
      <button id="histDelete" class="danger sm"><i class="ic" data-icon="trash"></i>删除选中</button>
      <button id="histCancel" class="sm">取消</button>
    </div>
    <div class="rb-list" id="histList"><div class="muted" style="padding:10px">加载中…</div></div>

    <div class="rb-head" id="evalHead" style="display:none">
      <b><i class="ic" data-icon="chart"></i>测试报告</b>
      <a href="/eval" target="_blank" class="muted"><i class="ic" data-icon="external"></i>详细报告</a>
    </div>
    <div class="rb-run" id="evalRun" style="display:none">
      <details class="set-picker" id="setPicker">
        <summary>测试集合：<b id="setLabel">全部</b><span class="chev"></span></summary>
        <div class="set-pop">
          <div class="set-list" id="setList"></div>
          <div class="row" style="margin-top:6px">
            <button id="setAll" class="sm">全选</button><button id="setNone" class="sm">清空</button>
          </div>
        </div>
      </details>
      <label class="muted">数量
        <select id="evalLimit">
          <option value="3">前 3 例</option>
          <option value="0">全部</option>
        </select></label>
      <button id="runEval" class="primary"><i class="ic" data-icon="play"></i>开始批量测试</button>
      <button id="cancelEval" class="danger" style="display:none"><i class="ic" data-icon="stop"></i>取消本次测试</button>
    </div>
    <div class="rb-list" id="evalList"><div class="muted" style="padding:10px" id="evalHint">加载中…</div></div>
  </aside>
</div>

<script src="/static/common.js?v=2"></script>
<script>
const state = { sessionId: null, busy: false, cfg: null,
  scenario: "", histOffset: 0, histTotal: 0, histSelect: false, histSelected: new Set(),
  evalSets: null, evalPicked: new Set(["all"]), evalTimer: null, myEvalId: null, evalOpened: null };

// ------------------------------------------------------------------ 基础工具
// 会话 id：优先 crypto.randomUUID（需要**安全上下文**）。用 http://<局域网IP>:8000 访问时它不存在，
// 直接调用会抛错——「新会话」点了没反应、页面一直留着上一个会话的状态就是这么来的（真实踩过）。
function newSessionId() {
  try {
    if (window.crypto?.randomUUID) return crypto.randomUUID().replace(/-/g, "");
    if (window.crypto?.getRandomValues) {
      const a = new Uint8Array(16);
      crypto.getRandomValues(a);
      return [...a].map((b) => b.toString(16).padStart(2, "0")).join("");
    }
  } catch { /* 继续用时间戳兜底 */ }
  return `${Date.now().toString(16)}${Math.random().toString(16).slice(2, 10)}`;
}

// localStorage 在隐私模式 / 被禁用时会抛错，包一层，不要让上层逻辑直接中断
function lsGet(key) { try { return localStorage.getItem(key); } catch { return null; } }
function lsSet(key, value) { try { localStorage.setItem(key, value); } catch { /* 隐私模式 / 配额满：不阻塞业务 */ } }

// 场景由 URL 决定：/ = 通用对话，/?scenario=consult = 结构化问诊，/?scenario=rural = 山区远程问诊
// 两个问诊场景都是「工作流 + AI 医生」，前端展示方式一致，只是接口与进度条不同
const isConsult = () => state.scenario === "consult";
const isRural = () => state.scenario === "rural";
const isDoctorScene = () => isConsult() || isRural();

function setSession(id) {
  state.sessionId = id; lsSet("sid", id);
  renderScenario();
  $("#sid").textContent = id;
  $("#sid").title = id;
  const base = state.cfg?.langfuse_project_url;
  $("#sessionLink").style.display = base ? "" : "none";
  if (base) $("#sessionLink").href = `${base}/sessions/${id}`;
}

// 进入场景 / 点历史会话时，把之前的对话（含节点卡片与 trace）回填到消息区
async function fetchSceneTurns(sid) {
  const s = await api(`${isRural() ? "/api/rural" : "/api/consult"}/${sid}`);
  const msgs = (s.turns || []).map((t) => ({ role: t.role === "user" ? "user" : "assistant", content: t.text,
    tools: t.steps, trace_id: t.trace_id, trace_url: t.trace_url }));
  return { state: s, msgs };
}

function renderSceneHistory(msgs) {
  const box = $("#messages");
  box.innerHTML = "";
  if (!msgs.length) { box.innerHTML = '<div class="empty" id="empty"><h2>这个会话还没有消息</h2></div>'; return; }
  msgs.forEach((m) => addMsg(m.role, md(m.content), { tools: m.tools, trace_id: m.trace_id,
                                                       trace_url: m.trace_url, usage: m.usage }));
}

function addMsg(role, html = "", opts = {}) {
  $("#empty")?.remove();
  const isDoctor = isDoctorScene();
  // 患者/用户靠右，AI（问诊场景是 AI 医生）靠左，与企微群测试页同一套排法
  const avatar = icon(role === "user" ? "user" : isDoctor ? "stethoscope" : "bot");
  const who = role === "user" ? "我" : isDoctor ? "AI 医生" : "AI 助手";
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  el.innerHTML = `<div class="avatar">${avatar}</div>
    <div class="bubble"><div class="who">${who}</div><div class="tools"></div><div class="content">${html}</div><div class="meta-bar"></div></div>`;
  // 历史回看：把当时的工具/节点卡片、trace 入口、token 用量一并还原
  if (opts.tools?.length) makeSteps($(".tools", el), opts.tools);
  fillMeta($(".meta-bar", el), opts);
  $("#messages").appendChild(el);
  $("#messages").scrollTop = 1e9;
  return el;
}

// ------------------------------------------------------------------ 执行步骤展示
// 整块可收起（默认收起）；**并行执行的节点合成一行**，串行的按竖列排。
// extract / assess 在 app/consult/graph.py 里是并发跑的，所以它们归为同一行。
const PARALLEL_OF = { extract: "judge", assess: "judge" };

function makeSteps(container, items) {
  const box = document.createElement("details");
  box.className = "steps";
  box.dataset.t0 = String(performance.now());
  box.innerHTML = `<summary></summary><div class="steps-body"></div>`;
  container.appendChild(box);
  updateSteps(box, items);
  return box;
}

function updateSteps(box, items) {
  const rows = [];
  (items || []).forEach((it) => {
    const g = PARALLEL_OF[it.name];
    if (g) {
      let row = rows.find((r) => r.g === g);
      if (!row) { row = { g, items: [] }; rows.push(row); }
      row.items.push(it);
    } else rows.push({ items: [it] });
  });
  const running = items.some((i) => i.status === "running");
  const ms = items.reduce((a, b) => a + (b.ms || 0), 0);
  const secs = ms ? (ms / 1000).toFixed(1) : ((performance.now() - Number(box.dataset.t0)) / 1000).toFixed(1);
  const label = isConsult() ? `${icon("stethoscope")} 问诊流程`
    : isRural() ? `${icon("mountain")} 山区问诊流程` : `${icon("activity")} 执行过程`;
  box.querySelector("summary").innerHTML = `${label} · ${rows.length} 行 / ${items.length} 步 · ${secs}s`
    + (running ? ` <span class="muted">${icon("loader", { cls: "spin" })} 进行中</span>` : "");
  box.querySelector(".steps-body").innerHTML = rows.map(stepRowHTML).join("");
}

function stepRowHTML(row) {
  if (row.items.length === 1) return stepCardHTML(row.items[0]);
  const names = row.items.map((i) => toolTitle(i.name, i.args || {})).join(' <span class="muted">＋</span> ');
  const bad = row.items.some((i) => i.status === "error");
  const running = row.items.some((i) => i.status === "running");
  const mark = bad ? `<span class="bad">${icon("xCircle")}</span>`
    : running ? `<span class="muted">${icon("loader", { cls: "spin" })}</span>`
    : `<span class="ok">${icon("checkCircle")}</span>`;
  const body = row.items.map((i) => `<div class="step-part"><div class="muted">${toolTitle(i.name, i.args || {})}</div>`
    + `${toolBody(i.name, i.args || {}, i.output || "")}</div>`).join("");
  return `<details class="tool parallel"><summary>${names} <span class="badge">并发</span> ${mark}</summary>${body}</details>`;
}

function stepCardHTML(it) {
  const mark = it.status === "error" ? `<span class="bad">${icon("xCircle")}</span>`
    : it.status === "running" ? `<span class="muted">${icon("loader", { cls: "spin" })}</span>`
    : `<span class="ok">${icon("checkCircle")}</span>`;
  return `<details class="tool ${it.status === "error" ? "error" : ""}">`
    + `<summary>${toolTitle(it.name, it.args || {})} ${mark}</summary>${toolBody(it.name, it.args || {}, it.output || "")}</details>`;
}

// 工具/节点卡片（单独使用时）
function toolCard(t) {
  const d = document.createElement("details");
  d.className = "tool" + (t.status === "error" ? " error" : "");
  d.innerHTML = `<summary>${toolTitle(t.name, t.args || {})} ${t.status === "error"
    ? `<span class="bad">${icon("xCircle")}</span>` : `<span class="ok">${icon("checkCircle")}</span>`}</summary>`
    + toolBody(t.name, t.args || {}, t.output || "");
  return d;
}

// 消息底栏：token 数 + Langfuse trace 入口 + 反馈按钮（历史回看也要有 trace 入口）
function fillMeta(meta, opts) {
  meta.dataset.traceId = opts.trace_id || "";
  const u = opts.usage;
  meta.innerHTML = `${u ? `<span>${icon("activity")}tokens ${u.input_tokens} → ${u.output_tokens}</span>` : ""}
    ${opts.trace_url ? `<a href="${esc(opts.trace_url)}" target="_blank">${icon("search")}查看 Trace</a>` : ""}
    ${opts.trace_id ? `<button data-v="1" title="回答有帮助">${icon("thumbsUp")}</button>`
      + `<button data-v="0" title="需要改进">${icon("thumbsDown")}</button>` : ""}`;
  meta.querySelectorAll("button").forEach((b) => (b.onclick = async () => {
    if (!meta.dataset.traceId) return;
    await api("/api/feedback", { method: "POST", body: JSON.stringify({ trace_id: meta.dataset.traceId, value: Number(b.dataset.v) }) });
    meta.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
  }));
}

async function send(text) {
  text = (text ?? $("#input").value).trim();
  if (!text || state.busy) return;
  state.busy = true; $("#send").disabled = true; $("#input").value = "";
  addMsg("user", md(text));
  const el = addMsg("assistant", "");
  const content = $(".content", el), tools = $(".tools", el), meta = $(".meta-bar", el);
  content.classList.add("cursor");
  let acc = "", traceId = null, traceUrl = null;
  let stepBox = null;
  const steps = [];   // 本轮步骤（含并发节点），每次变化重建整块（并行行才稳定）

  const body = {
    message: text, session_id: state.sessionId,
    model: $("#model").value, temperature: Number($("#temperature").value),
    use_tools: $("#useTools").checked, web_search: $("#webSearch").checked, use_skills: $("#useSkills").checked,
    prompt_name: $("#promptName").value,
    scenario: state.scenario || undefined,
    ...parseVersionSel($("#promptVersion").value),
  };
  if ($("#useOverride").checked && $("#promptOverride").value.trim()) body.prompt_override = $("#promptOverride").value;

  try {
    await streamSSE("/api/chat/stream", body, (ev, d) => {
      if (ev === "meta") {
        traceId = d.trace_id; traceUrl = d.trace_url;
        $("#topMeta").innerHTML = `${esc(d.model)} · T=${d.temperature} · prompt ${esc(d.prompt.name)}${d.prompt.version ? " v" + d.prompt.version : ""} (${esc(d.prompt.source)})`
          + (d.tools.includes("web_search") ? ` · ${icon("globe")} 联网` : "")
          + (d.skills.length ? ` · ${icon("sparkles")} ${d.skills.length} skills` : "");
      } else if (ev === "token") {
        acc += d.content; content.innerHTML = md(acc);
      } else if (ev === "replace") {
        acc = d.content; content.innerHTML = md(acc);   // 工作流截断了超出上限的问题
      } else if (ev === "queued") {
        content.innerHTML = `<span class="muted">${icon("loader", { cls: "spin" })} ${esc(d.message || "排队中…")}</span>`;
      } else if (ev === "tool_start") {
        steps.push({ id: d.id, name: d.name, args: d.args || {}, output: "", status: "running" });
        if (!stepBox) stepBox = makeSteps(tools, steps); else updateSteps(stepBox, steps);
      } else if (ev === "tool_end") {
        const row = steps.find((s) => s.id === d.id) || (steps.push({ id: d.id, name: d.name, args: {} }), steps[steps.length - 1]);
        row.output = d.output || "";
        row.status = d.status || "success";
        if (!stepBox) stepBox = makeSteps(tools, steps); else updateSteps(stepBox, steps);
      } else if (ev === "done") {
        fillMeta(meta, { trace_id: d.trace_id || traceId, trace_url: d.trace_url || traceUrl, usage: d.usage });
      } else if (ev === "error") {
        content.innerHTML += `<p class="bad">${icon("xCircle")} ${esc(d.message)}</p>`;
      }
      $("#messages").scrollTop = 1e9;
    });
  } catch (e) {
    content.innerHTML += `<p class="bad">${icon("xCircle")} ${esc(e.message)}</p>`;
  } finally {
    content.classList.remove("cursor");
    if (!acc && !content.textContent.trim()) content.innerHTML = '<span class="muted">(无输出)</span>';
    state.busy = false; $("#send").disabled = false; $("#input").focus();
    refreshPptFlow(); refreshConsultFlow(); refreshRuralFlow();
    if ($(".app").classList.contains("with-right")) refreshHistory();
  }
}

// ------------------------------------------------------------------ 右侧面板：会话历史 + 测试报告
function setRightPanel(open) {
  document.querySelector(".app").classList.toggle("with-right", open);
  lsSet("rightPanel", open ? "1" : "0");
  if (open) refreshAll();
}

async function refreshAll() {
  state.histOffset = 0;   // 切场景/重新打开面板时回到第一页
  state.histSelected = new Set();   // 选中的 id 属于另一个场景，清掉
  await Promise.all([refreshHistory(), refreshEvals()]);
}

const HIST_PAGE_SIZE = 10;   // 会话历史每页条数（右侧面板窄，10 条刚好）

// 多选模式：标题栏按钮切换；进入后点条目是勾选而不是打开，底部出现「全选 / 删除选中 / 取消」
function setHistSelect(on) {
  state.histSelect = on;
  if (!on) state.histSelected = new Set();
  $("#histBar").style.display = on ? "" : "none";
  $("#histSelect").classList.toggle("primary", on);
  refreshHistory();
}

function renderHistBar() {
  const n = state.histSelected.size;
  $("#histCount").textContent = `已选 ${n}`;
  $("#histDelete").disabled = n === 0;
}

async function deleteSelected() {
  const ids = [...state.histSelected];
  if (!ids.length) return;
  if (!confirm(`确定删除选中的 ${ids.length} 个会话？删除后不可恢复。`)) return;
  const url = isConsult() ? "/api/consult/sessions/delete" : isRural() ? "/api/rural/sessions/delete" : "/api/sessions/delete";
  const btn = $("#histDelete");
  btn.disabled = true;
  try {
    const r = await api(url, { method: "POST", body: JSON.stringify({ session_ids: ids }) });
    // 删掉的如果包含当前会话，就开一个新会话，避免继续写回一个已删除的会话
    if (ids.includes(state.sessionId)) newSession();
    state.histSelected = new Set();
    await refreshHistory();
    console.info("已删除", r.removed, "个会话");
  } catch (e) {
    alert("删除失败：" + e.message);
  } finally { btn.disabled = false; renderHistBar(); }
}

async function refreshHistory() {
  const scope = isConsult() ? "consult" : isRural() ? "rural" : "chat";
  $("#histScope").textContent = scope === "consult" ? "问诊" : scope === "rural" ? "山区问诊" : "对话";
  const offset = Math.max(state.histOffset || 0, 0);
  const url = scope === "consult"
    ? `/api/consult/sessions?limit=${HIST_PAGE_SIZE}&offset=${offset}`
    : scope === "rural"
    ? `/api/rural/sessions?limit=${HIST_PAGE_SIZE}&offset=${offset}`
    : `/api/sessions?limit=${HIST_PAGE_SIZE}&offset=${offset}`;
  try {
    const r = await api(url);
    const rows = r.sessions || [], total = r.total ?? rows.length;
    state.histTotal = total;
    // 删过头了（比如当前页最后一条被删）：回退一页重拉
    if (!rows.length && total > 0 && offset > 0) {
      state.histOffset = Math.max(0, offset - HIST_PAGE_SIZE);
      return refreshHistory();
    }
    const head = rows.length
      ? rows.map((s) => {
          const picked = state.histSelected.has(s.session_id);
          return `<div class="hist-item ${s.session_id === state.sessionId ? "cur" : ""} ${picked ? "picked" : ""}" data-sid="${esc(s.session_id)}">
            ${state.histSelect ? `<input type="checkbox" class="hist-ck" ${picked ? "checked" : ""} />` : ""}
            <div class="t">${esc(s.title)}</div>
            <div class="m">${esc(s.updated_at || "")} · ${esc(s.note || "")}</div></div>`;
        }).join("")
      : '<div class="muted" style="padding:10px">还没有历史会话</div>';
    $("#histList").innerHTML = head + histPager(r);
    $("#histList").querySelectorAll(".hist-item").forEach((el) => (el.onclick = () => {
      const sid = el.dataset.sid;
      if (state.histSelect) {
        state.histSelected.has(sid) ? state.histSelected.delete(sid) : state.histSelected.add(sid);
        refreshHistory();
      } else openSession(sid);
    }));
    bindHistPager();
    renderHistBar();
  } catch (e) { $("#histList").innerHTML = `<div class="muted" style="padding:10px">加载失败：${esc(e.message)}</div>`; }
}

// 分页控件：上一页 / 页码 / 下一页（会话多时不会一次性拉全部）
function histPager(r) {
  const total = r.total ?? 0, limit = r.limit || HIST_PAGE_SIZE, offset = r.offset || 0;
  if (total <= limit) return `<div class="hist-pager muted">共 ${total} 条</div>`;
  const page = Math.floor(offset / limit) + 1;
  const pages = Math.ceil(total / limit);
  return `<div class="hist-pager">
    <button data-page="${page - 1}" ${page <= 1 ? "disabled" : ""}>← 上一页</button>
    <span class="muted">${page} / ${pages}（共 ${total} 条）</span>
    <button data-page="${page + 1}" ${page >= pages ? "disabled" : ""}>下一页 →</button></div>`;
}

function bindHistPager() {
  $("#histList").querySelectorAll(".hist-pager button").forEach((b) => (b.onclick = () => {
    // data-page 是 1 起的页码，offset 要按 0 起算：(page - 1) * size
    state.histOffset = Math.max(0, (Number(b.dataset.page) - 1) * HIST_PAGE_SIZE);
    refreshHistory();
  }));
}

// 点历史条目：切到那个会话并把对话内容回填到消息区
async function openSession(sid) {
  setSession(sid);
  $("#messages").innerHTML = '<div class="empty" id="empty"><h2>正在载入历史…</h2></div>';
  let msgs = [];
  if (isDoctorScene()) {
    // 问诊的对话记录里存了每轮的节点步骤与 trace，一并还原
    msgs = (await fetchSceneTurns(sid).catch(() => ({ msgs: [] }))).msgs;
  } else {
    const h = await api(`/api/sessions/${sid}/history`);
    msgs = h.messages || [];
  }
  renderSceneHistory(msgs);
  refreshConsultFlow(); refreshRuralFlow(); refreshPptFlow(); refreshHistory();
}

async function refreshEvals() {
  // 两个问诊场景都有跑批：问诊 → /api/consult/*，山区问诊 → /api/rural/*（通用对话不跑批）
  if (!isConsult() && !isRural()) {
    $("#evalHead").style.display = "none"; $("#evalRun").style.display = "none"; $("#evalList").style.display = "none";
    return;
  }
  $("#evalHead").style.display = ""; $("#evalRun").style.display = ""; $("#evalList").style.display = "";
  await loadEvalSets();
  await pollEvalRun();   // 有未结束/刚结束的跑批就先显示它，否则显示概览
}

// 跑批/报告接口跟着场景走；测试集合的选择按场景分开记（问诊的科室 ≠ 山区的处置层级）
const evalApi = () => (isRural() ? "/api/rural" : "/api/consult");
const evalSetKey = () => `evalSets:${state.scenario}`;
const evalPageUrl = (id) => `/eval${isRural() ? "?scenario=rural" : ""}${id ? "#" + id : ""}`;

// 最近几份报告概览（详情在独立页 /eval）
async function renderEvalOverview() {
  $("#evalHead").querySelector("a")?.setAttribute("href", evalPageUrl());
  try {
    const r = await api(`${evalApi()}/evals?limit=5`);
    const rows = r.evals || [];
    $("#evalList").innerHTML = rows.length
      ? rows.map((e) => `<div class="eval-card" data-id="${esc(e.id)}">
          <div class="head"><b>${esc(e.created_at)}</b><span class="badge ${e.passed === e.total ? "ok" : "err"}">${e.passed}/${e.total} 通过</span></div>
          <div class="eval-stat">${esc(e.set_label || "")} · ${Math.round((e.duration_ms || 0) / 1000)}s · ${e.has_analysis ? "已 AI 分析" : "未分析"}</div>
        </div>`).join("")
      : '<div class="muted" style="padding:10px">还没有测试报告，选好集合点「开始批量测试」</div>';
    // 点概览卡片→新开独立页并直接打开那一份（# 不触发页面刷新）
    $("#evalList").querySelectorAll(".eval-card").forEach((el) =>
      (el.onclick = () => window.open(evalPageUrl(el.dataset.id), "_blank")));
  } catch (e) { $("#evalList").innerHTML = `<div class="muted" style="padding:10px">加载失败：${esc(e.message)}</div>`; }
}

// 跑批进度：任务在**服务端后台**跑，刷新页面也不中断；这里只轮询状态
function renderEvalProgress(s) {
  const head = s.status === "running"
    ? `${icon("loader", { cls: "spin" })} ${esc(s.sets)} · ${s.done}/${s.total}${s.current ? ` · 正在跑：${esc(s.current)}` : ""}`
    : `${s.status === "done" ? `${icon("checkCircle")} 完成` : s.status === "cancelled" ? `${icon("stop")} 已取消` : `${icon("xCircle")} 失败`}：${esc(s.sets)} · ${s.done}/${s.total}`;
  $("#evalList").innerHTML = `<div class="eval-progress"><b>${head}</b><br>${(s.lines || []).map(esc).join("<br>")}</div>`;
  $("#evalList").scrollTop = $("#evalList").scrollHeight;
}

async function pollEvalRun() {
  let s;
  try { s = await api(`${evalApi()}/eval/run/status`); } catch { return; }
  if (s.status === "idle") {
    stopEvalPoll();
    await renderEvalOverview();
    return;
  }
  renderEvalProgress(s);
  const running = s.status === "running";
  $("#runEval").disabled = running;
  $("#runEval").innerHTML = running ? `${icon("loader", { cls: "spin" })}测试中…` : `${icon("play")}开始批量测试`;
  $("#cancelEval").style.display = running ? "" : "none";
  if (running) startEvalPoll(); else stopEvalPoll();
  // 自己发起的那一轮跑完：刷新概览并自动打开详细报告（只开一次，刷新页面不会重开）
  if (!running && s.report_id && s.id === state.myEvalId && state.evalOpened !== s.id) {
    state.evalOpened = s.id;
    await renderEvalOverview();
    window.open(evalPageUrl(s.report_id), "_blank");
  } else if (!running) {
    await renderEvalOverview();
  }
}

function startEvalPoll() { if (!state.evalTimer) state.evalTimer = setInterval(pollEvalRun, 1500); }
function stopEvalPoll() { if (state.evalTimer) { clearInterval(state.evalTimer); state.evalTimer = null; } }

async function cancelEvalRun() {
  // 同样不用 confirm（可能被浏览器拦住）：点一下就取消，面板里会看到「已取消」
  const btn = $("#cancelEval");
  btn.disabled = true;
  await api(`${evalApi()}/eval/run/cancel`, { method: "POST" }).catch(() => {});
  await pollEvalRun();
  btn.disabled = false;
}

// 测试集合来自 eval 目录结构（后端 /api/consult|rural /eval/sets），**可多选**；选择按场景分开记
async function loadEvalSets() {
  if (state.evalSets) return state.evalSets;
  try {
    const r = await api(`${evalApi()}/eval/sets`);
    state.evalSets = r.sets || [];
    const saved = JSON.parse(lsGet(evalSetKey()) || '["all"]');
    state.evalPicked = new Set(Array.isArray(saved) && saved.length ? saved : ["all"]);
    renderEvalSets();
  } catch { /* 拉不到就用默认全部 */ }
  return state.evalSets;
}

function renderEvalSets() {
  const sets = state.evalSets || [];
  $("#setList").innerHTML = sets.map((s) => `<label class="set-opt">
      <input type="checkbox" data-key="${esc(s.key)}" ${state.evalPicked.has(s.key) ? "checked" : ""} />
      <span>${esc(s.label)}</span><span class="muted">${s.count} 例</span></label>`).join("");
  $("#setList").querySelectorAll("input[data-key]").forEach((ck) => (ck.onchange = () => {
    const key = ck.dataset.key;
    if (ck.checked) {
      // 「全部」与具体科室/处置层级互斥：选了全部就清掉其它，选了具体集合就去掉全部
      if (key === "all") state.evalPicked = new Set(["all"]);
      else { state.evalPicked.delete("all"); state.evalPicked.add(key); }
    } else state.evalPicked.delete(key);
    if (!state.evalPicked.size) state.evalPicked = new Set(["all"]);   // 一个都不选 → 回到全部
    lsSet(evalSetKey(), JSON.stringify([...state.evalPicked]));
    renderEvalSets();
  }));
  // 摘要：全部（11） / 紧急转运、县医院（8 例）
  const picked = sets.filter((s) => state.evalPicked.has(s.key));
  const all = state.evalPicked.has("all") || !picked.length;
  const count = all ? (sets.find((s) => s.key === "all")?.count ?? 0) : picked.reduce((n, s) => n + s.count, 0);
  $("#setLabel").textContent = (all ? "全部" : picked.map((s) => s.label).join("、")) + `（${count} 例）`;
}

// 在右栏直接跑一轮：任务在服务端后台跑（刷新不影响），这里只发起 + 轮询。
// ⚠️ **不要用 confirm()/alert() 做确认**：浏览器勾了「阻止此页面创建更多对话框」（或有弹窗拦截插件）后
// confirm 会静默返回 false，点了按钮看起来没反应（实际没发出 /eval/run 请求，真实踩过）。
// 改成「点了就启动 + 面板内联反馈」，要停就用旁边的「取消本次测试」。
async function runEvalFromPanel() {
  const btn = $("#runEval");
  await loadEvalSets();
  const keys = [...(state.evalPicked || new Set(["all"]))];
  const limit = Number($("#evalLimit").value) || 0;
  const label = $("#setLabel").textContent;
  btn.disabled = true;
  btn.innerHTML = `${icon("loader", { cls: "spin" })}启动中…`;
  $("#evalList").innerHTML = `<div class="eval-progress"><b>正在启动：${esc(label)}${limit ? `（只跑前 ${limit} 例）` : "（全部）"}</b><br>`
    + "任务在服务端后台跑，刷新页面/关标签页都不会中断；要停就点下面的「取消本次测试」。</div>";
  try {
    const s = await api(`${evalApi()}/eval/run?sets=${encodeURIComponent(keys.join(","))}&limit=${limit}`, { method: "POST" });
    state.myEvalId = s.id;     // 自己发起的那轮，跑完自动打开报告
    state.evalOpened = null;
  } catch (e) {
    // 失败也要说清楚（例如 409：已有一轮在跑），不能只弹一个可能被拦住的 alert
    $("#evalList").innerHTML = `<div class="eval-progress"><b class="bad">${icon("xCircle")} 启动失败</b><br>${esc(e.message)}</div>`;
    btn.disabled = false;
    btn.innerHTML = `${icon("play")}开始批量测试`;
    return;
  }
  startEvalPoll();   // 立刻开始轮询，进度马上显示出来
  await pollEvalRun();
}

// ------------------------------------------------------------------ 场景：结构化问诊 / 山区远程问诊
const CONSULT_STEPS = [["intake", "现病史"], ["triage", "分诊"], ["differential", "鉴别问询"], ["diagnosis", "诊断"], ["followup", "变化随访"]];
const CONSULT_CHIPS = ["我上腹痛 3 天了", "最近老是头晕", "咳嗽一周还发烧", "孩子起疹子发热", "小便时又疼又急"];
// 山区问诊多一格「就医条件」（app/rural/graph.py）：它决定去哪一级医院，所以单列出来
const RURAL_STEPS = [["intake", "现病史"], ["access", "就医条件"], ["triage", "就医建议"], ["differential", "鉴别问询"], ["diagnosis", "诊断"], ["followup", "变化随访"]];
const RURAL_CHIPS = ["我爹在地里被蛇咬了", "我媳妇孕晚期破水了", "老人烧炭取暖后头晕呕吐", "孩子发烧抽起来了", "我腰疼 3 天了"];

function renderScenario() {
  const onConsult = isConsult(), onRural = isRural();
  $("#navConsult")?.classList.toggle("active", onConsult);
  $("#navRural")?.classList.toggle("active", onRural);
  $("#navChat")?.classList.toggle("active", !onConsult && !onRural);
  $("#sceneTitle").textContent = onConsult ? "结构化问诊" : onRural ? "山区远程问诊" : "对话";
}

// 场景由 URL 决定：/ = 通用对话，/?scenario=consult = 结构化问诊
// （切换场景时右侧面板的历史列表与测试报告跟着换）

// 问诊进度条：现病史 → 分诊 → 鉴别问询 → 诊断 → 变化随访
async function refreshConsultFlow() {
  const el = $("#consultFlow");
  if (!isConsult()) { el.style.display = "none"; return; }
  try {
    const s = await api(`/api/consult/${state.sessionId}`);
    const active = !!s.active;
    const closed = active && s.stage === "closed";   // 已结束：没有「当前阶段」，不要把最后一格高亮成正在进行
    const cur = active ? CONSULT_STEPS.findIndex(([k]) => k === s.stage) : 0;
    const steps = CONSULT_STEPS.map(([k, label], i) => {
      // 轮次是「至少几轮」的门槛，超过后就只显示实际轮数，不要显示成 4/2
      const rounds = (n, min) => (n ? ` ${n >= min ? n : n + "/" + min}轮` : "");
      let extra = "";
      if (active && k === "intake") extra = rounds(s.intake_rounds || 0, s.min_intake_rounds || 2);
      if (active && k === "differential") extra = rounds(s.differential_rounds || 0, s.min_differential_rounds || 2);
      if (active && k === "diagnosis") extra = (s.diagnoses || []).length ? ` v${s.diagnoses.length}` : "";
      if (active && k === "followup") extra = (s.changes || []).length ? ` ${s.changes.length}次` : "";
      const cls = closed ? "done"
        : active ? (cur < 0 ? "cur" : i < cur ? "done" : i === cur ? "cur" : "")
        : i === 0 ? "cur" : "";
      return `<span class="step ${cls}">${label}${extra}</span>`;
    }).join(`<span class="sep">›</span>`);
    el.innerHTML = `${icon("stethoscope")} 问诊：` + steps
      + (closed ? `<span class="sep">›</span><span class="step cur">已结束</span>` : "");
    el.style.display = "";
  } catch { el.style.display = "none"; }
}

// 从顶部导航「🩺 问诊」进入（/?scenario=consult）：启用 Skills、告知当前进度，不重置已有问诊
async function enterConsult({ intro = true } = {}) {
  if (!$("#useSkills").checked) {  // 问诊依赖 consult skill 与工具
    $("#useSkills").checked = true; lsSet("opt:useSkills", "1");
  }
  state.scenario = "consult";
  renderScenario();
  const { state: s, msgs } = await fetchSceneTurns(state.sessionId).catch(() => ({ state: null, msgs: [] }));
  refreshConsultFlow();
  if (s && s.active) {
    renderSceneHistory(msgs);   // 把之前的问答（含每轮节点卡片与 trace）回填，而不是只留一句「已恢复」
    const last = (s.diagnoses || []).slice(-1)[0];
    if (s.stage === "closed") {
      // 已结束的问诊不能说「继续描述或回答即可」（会让人以为还在流程里）
      addMsg("assistant", `${icon("stethoscope")} 上一次问诊已经结束了。`
        + (last && last.primary ? `当时的主要考虑：<b>${esc(last.primary)}</b>。` : "")
        + "要问新的不适，直接描述就行，我会<b>从头重新采集</b>；想彻底分开就点左侧「新会话」。");
    } else {
      addMsg("assistant", `${icon("stethoscope")} 已恢复本次问诊。当前阶段：<b>${esc(s.stage_label || "")}</b>`
        + (s.missing && s.missing.length ? `，还缺 ${s.missing.length} 项现病史要素` : "")
        + "。继续描述或回答即可。");
    }
    $("#input").focus();
    return;
  }
  if (!intro) return;
  const el = addMsg("assistant", `${icon("stethoscope")} 已进入<b>结构化问诊</b>场景。请描述你的不适，我会先分几轮了解现病史；`
    + "随后给出建议就诊科室（分诊），再做鉴别问询并给出诊断意见。"
    + '<div class="chips">' + CONSULT_CHIPS.map((t) => `<button>${esc(t)}</button>`).join("") + "</div>"
    + "<div class=\"muted\" style=\"margin-top:8px\">也可以直接输入，例如「胸口疼两天了，活动后加重」；每次问诊都会在 Langfuse 中留下完整 Trace。</div>");
  el.querySelectorAll(".chips button").forEach((b) => (b.onclick = () => send(b.textContent)));
  $("#input").focus();
}

// 山区问诊进度条：现病史 → 就医条件 → 就医建议 → 鉴别问询 → 诊断 → 变化随访
async function refreshRuralFlow() {
  const el = $("#ruralFlow");
  if (!isRural()) { el.style.display = "none"; return; }
  try {
    const s = await api(`/api/rural/${state.sessionId}`);
    const active = !!s.active;
    const closed = active && s.stage === "closed";   // 已结束：全格标已完成，末尾加「已结束」
    const cur = active ? RURAL_STEPS.findIndex(([k]) => k === s.stage) : 0;
    const steps = RURAL_STEPS.map(([k, label], i) => {
      const rounds = (n, min) => (n ? ` ${n >= min ? n : n + "/" + min}轮` : "");
      let extra = "";
      if (active && k === "intake") extra = rounds(s.intake_rounds || 0, s.min_intake_rounds || 2);
      if (active && k === "access") extra = (s.missing_access || []).length ? " 待问" : " 已问";
      if (active && k === "triage") extra = (s.triage && s.triage.disposition) ? ` ${(s.dispositions || {})[s.triage.disposition]?.split("（")[0] || ""}` : "";
      if (active && k === "differential") extra = rounds(s.differential_rounds || 0, s.min_differential_rounds || 1);
      if (active && k === "diagnosis") extra = (s.diagnoses || []).length ? ` v${s.diagnoses.length}` : "";
      if (active && k === "followup") extra = (s.changes || []).length ? ` ${s.changes.length}次` : "";
      const cls = closed ? "done"
        : active ? (cur < 0 ? "cur" : i < cur ? "done" : i === cur ? "cur" : "")
        : i === 0 ? "cur" : "";
      return `<span class="step ${cls}">${label}${extra}</span>`;
    }).join(`<span class="sep">›</span>`);
    el.innerHTML = `${icon("mountain")} 山区问诊：` + steps
      + (closed ? `<span class="sep">›</span><span class="step cur">已结束</span>` : "");
    el.style.display = "";
  } catch { el.style.display = "none"; }
}

// 从顶部导航「🏔 山区问诊」进入（/?scenario=rural）：不只是问症状，还要问就医条件，
// 给出「去哪儿看、怎么去」——服务对象是偏远山区村民本人（多为老人）
async function enterRural({ intro = true } = {}) {
  state.scenario = "rural";
  renderScenario();
  const { state: s, msgs } = await fetchSceneTurns(state.sessionId).catch(() => ({ state: null, msgs: [] }));
  refreshRuralFlow();
  if (s && s.active) {
    renderSceneHistory(msgs);   // 回填之前的问答（含节点卡片与 trace）
    const last = (s.diagnoses || []).slice(-1)[0];
    if (s.stage === "closed") {
      addMsg("assistant", `${icon("mountain")} 上一次山区问诊已经结束了。`
        + (last && (last.primary || last.disposition) ? `当时的结论：<b>${esc(last.primary || "")}</b>`
            + (last.disposition ? `（${esc((s.dispositions || {})[last.disposition] || "")}）` : "") + "。" : "")
        + "要问新的不舒服，直接描述就行，我会<b>从头重新采集</b>；想彻底分开就点左侧「新会话」。")
    } else {
      addMsg("assistant", `${icon("mountain")} 已恢复本次山区问诊。当前阶段：<b>${esc(s.stage_label || "")}</b>`
        + (s.missing && s.missing.length ? `，还缺 ${s.missing.length} 项现病史要素` : "")
        + (s.missing_access && s.missing_access.length ? "，还需要了解就医条件（路远不远、有没有人能陪）" : "")
        + "。继续描述或回答即可。")
    }
    $("#input").focus();
    return;
  }
  if (!intro) return;
  const el = addMsg("assistant", `${icon("mountain")} 已进入<b>山区远程问诊</b>。请用大白话说哪里不舒服、什么时候开始的；`
    + "我会一次只问一个问题，问清病情后再问怎么去、有没有车、有没有人陪，"
    + "最后告诉你<b>先去哪一级医院（村卫生室 / 乡镇卫生院 / 县医院 / 打 120）、怎么去</b>。"
    + '<div class="chips">' + RURAL_CHIPS.map((t) => `<button>${esc(t)}</button>`).join("") + "</div>"
    + "<div class=\"muted\" style=\"margin-top:8px\">紧急情况（蛇咬、农药中毒、胸痛大汗、抽搐、大出血、临产、摔伤不能动）请直接打 120，不要等回复。</div>");
  el.querySelectorAll(".chips button").forEach((b) => (b.onclick = () => send(b.textContent)));
  $("#input").focus();
}

const TOOL_ICONS = { web_search: "search", fetch_webpage: "fileText", load_skill: "sparkles", get_current_time: "clock", calculator: "cpu", get_weather: "globe",
  ppt_save_requirements: "listChecks", ppt_propose_outline: "fileText", ppt_confirm_outline: "checkCircle", ppt_search_images: "image",
  ppt_download_image: "download", ppt_make_diagram: "branches", ppt_verify: "eye", report_run_generator: "sliders", ppt_workflow_status: "target",
  generate_image: "image", edit_image: "image", report_preview_style: "eye", report_list_styles: "layers", report_save_style: "check",
  load_state: "database", extract: "fileText", assess: "brain", decide: "target", ask_history: "stethoscope", triage: "gauge",
  ask_access: "mountain", ask_differential: "search", diagnose: "stethoscope", re_diagnose: "refresh", ask_followup: "bell", close: "checkCircle", save_state: "database" };
// 问诊工作流的节点（app/consult/graph.py）：对话页把它当成一张张工具卡片展示
// extract 与 assess 是并发跑的，decide 是两个判断的汇合点（合并提取结果 + 钳制动作）
const CONSULT_NODE_LABELS = { load_state: "读取问诊状态", extract: "提取患者信息", assess: "判断下一步",
  decide: "合并与钳制", ask_history: "采集现病史", triage: "给出分诊建议", ask_differential: "鉴别问询",
  diagnose: "给出诊断意见", re_diagnose: "更新诊断意见", ask_followup: "追问病情变化",
  close: "结束问诊", save_state: "保存问诊状态" };
// 山区问诊工作流的节点（app/rural/graph.py）：与问诊同一套卡片，多了「问就医条件」
const RURAL_NODE_LABELS = { load_state: "读取问诊状态", extract: "提取信息与就医条件", assess: "判断下一步",
  decide: "合并与钳制", ask_history: "采集现病史", ask_access: "问就医条件", triage: "给出就医建议",
  ask_differential: "鉴别问询", diagnose: "给出诊断意见", re_diagnose: "更新诊断意见",
  ask_followup: "追问病情变化", close: "结束问诊", save_state: "保存问诊状态" };
const PPT_TOOL_LABELS = { ppt_save_requirements: "记录需求", ppt_propose_outline: "提交大纲", ppt_confirm_outline: "确认大纲",
  ppt_search_images: "搜索图片", ppt_download_image: "下载图片", ppt_make_diagram: "绘制示意图", ppt_verify: "渲染验证",
  ppt_workflow_status: "查看流程状态", generate_image: "AI 生成图片", edit_image: "AI 编辑图片",
  report_preview_style: "样式预览", report_list_styles: "查看样式", report_save_style: "保存样式" };
// PPT 制作流程进度条：需求 → 大纲 → 确认 → 生成 → 验证
const PPT_STEPS = [["requirements", "需求"], ["outline_review", "大纲确认"], ["approved", "生成"], ["generated", "验证"], ["delivered", "交付"]];
async function refreshPptFlow() {
  const el = $("#pptFlow");
  try {
    const s = await api(`/api/ppt/workflow/${state.sessionId}`);
    if (!s.active) { el.style.display = "none"; return; }
    const stage = s.stage === "needs_fix" ? "generated" : s.stage;
    const cur = PPT_STEPS.findIndex(([k]) => k === stage);
    el.innerHTML = `${icon("chart")} PPT 制作：` + PPT_STEPS.map(([k, label], i) =>
      `<span class="step ${i < cur ? "done" : i === cur ? "cur" : ""}">${label}${k === "outline_review" && s.outline_version ? " v" + s.outline_version : ""}${k === "generated" && s.stage === "needs_fix" ? "（待修复）" : ""}</span>`).join(`<span class="sep">›</span>`);
    el.style.display = "";
  } catch { el.style.display = "none"; }
}
function toolTitle(name, args = {}) {
  const icon = ICONS(TOOL_ICONS[name] || "cpu");
  if (name === "web_search") return `${icon} 搜索 <b>${esc(args.query || "")}</b>${args.topic === "news" ? ' <span class="badge">新闻</span>' : ""}${args.time_range ? ` <span class="badge">${esc(args.time_range)}</span>` : ""}`;
  if (name === "fetch_webpage") { let h = args.url || ""; try { h = new URL(args.url).hostname; } catch {} return `${icon} 阅读 <b>${esc(h)}</b>`; }
  if (name === "load_skill") return `${icon} 加载技能 <b>${esc(args.name || "")}</b>${args.file ? " / " + esc(args.file) : ""}`;
  if (PPT_TOOL_LABELS[name]) {
    const extra = args.name || args.query || args.kind || (args.outline && args.outline.title) || (args.version ? "v" + args.version : "") || args.file || "";
    return `${icon} ${PPT_TOOL_LABELS[name]} <b>${esc(extra)}</b>`;
  }
  if (CONSULT_NODE_LABELS[name] || RURAL_NODE_LABELS[name]) {
    const extra = args.department || args.primary || args.title || (args.version ? "v" + args.version : "")
      || (args.action ? args.action : "");
    return `${icon} ${(isRural() ? RURAL_NODE_LABELS : CONSULT_NODE_LABELS)[name]}${extra ? ` <b>${esc(String(extra).slice(0, 60))}</b>` : ""}`;
  }
  if (name === "report_run_generator") return `${icon} 生成报告 <b>${esc(args.skill || "")}</b>`;
  return `${icon} <b>${esc(name)}</b> <span class="muted">${esc(JSON.stringify(args))}</span>`;
}
function toolBody(name, args, output) {
  if (name === "web_search") {
    const items = [...output.matchAll(/\[(\d+)\] (.*)\nURL: (\S+)(?:\n([^\n]*))?/g)];
    if (items.length) return `<ol class="sources">${items.map(([, n, title, url]) => {
      let host = url; try { host = new URL(url).hostname.replace(/^www\./, ""); } catch {}
      return `<li><a href="${esc(url)}" target="_blank">${esc(title)}</a> <span class="muted">${esc(host)}</span></li>`;
    }).join("")}</ol>`;
  }
  // 工具结果里带图片（验证预览、AI 生图、示意图、样式样张）时直接显示
  const imgs = [...output.matchAll(/!\[[^\]]*\]\((\/api\/(?:ppt\/preview|workspace\/files)\/[^)\s]+)\)/g)].map((m) => m[1]);
  if (imgs.length) {
    return `<pre>${esc(output)}</pre>` + imgs.map((u) => `<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" style="max-width:100%;margin-top:6px;border-radius:6px"></a>`).join("");
  }
  if (name === "fetch_webpage" && args.url) return `<div class="muted" style="margin-top:4px"><a href="${esc(args.url)}" target="_blank">${esc(args.url)}</a></div><pre>${esc(output.slice(0, 600))}${output.length > 600 ? "…" : ""}</pre>`;
  return `<pre>${esc(output)}</pre>`;
}

async function loadPrompt() {
  const q = parseVersionSel($("#promptVersion").value);
  const qs = new URLSearchParams(Object.entries({ label: q.prompt_label, version: q.prompt_version }).filter(([, v]) => v != null));
  try {
    const p = await api(`/api/prompts/${encodeURIComponent($("#promptName").value)}?${qs}`);
    $("#promptOverride").value = p.template;
    $("#promptInfo").textContent = `来源: ${p.source}${p.version ? " · v" + p.version : ""} · config: ${JSON.stringify(p.config)}`;
  } catch (e) { $("#promptInfo").textContent = "载入失败: " + e.message; }
}

async function init() {
  state.cfg = await api("/api/config");
  const c = state.cfg;
  $("#appName").textContent = c.app_name; document.title = `${c.app_name} · 对话`;
  $("#model").innerHTML = c.models.map((m) => `<option ${m === c.default_model ? "selected" : ""}>${esc(m)}</option>`).join("");
  $("#temperature").value = c.temperature; $("#tempVal").textContent = c.temperature;
  paintRange($("#temperature"));
  $("#temperature").oninput = (e) => { $("#tempVal").textContent = e.target.value; paintRange(e.target); };
  $("#lfLink").href = c.langfuse_project_url || c.langfuse_host;
  $("#searchInfo").textContent = `搜索服务：${c.search.provider}`;
  $("#skillList").innerHTML = c.skills.length ? c.skills.map((n) => `<span class="badge">${esc(n)}</span>`).join(" ") : "skills/ 目录下暂无技能";
  // 记住开关状态
  ["useTools", "webSearch", "useSkills"].forEach((id) => {
    const v = lsGet("opt:" + id); if (v !== null) $("#" + id).checked = v === "1";
    $("#" + id).onchange = (e) => lsSet("opt:" + id, e.target.checked ? "1" : "0");
  });
  setSession(state.sessionId || lsGet("sid") || newSessionId());
  renderScenario();
  refreshPptFlow();
  refreshConsultFlow();
  refreshRuralFlow();
  setRightPanel(lsGet("rightPanel") === "1");
  $("#toggleRight").onclick = () => setRightPanel(!document.querySelector(".app").classList.contains("with-right"));
  $("#histRefresh").onclick = refreshHistory;
  $("#runEval").onclick = runEvalFromPanel;
  $("#cancelEval").onclick = cancelEvalRun;
  $("#setAll").onclick = () => { state.evalPicked = new Set((state.evalSets || []).map((s) => s.key).filter((k) => k !== "all")); lsSet(evalSetKey(), JSON.stringify([...state.evalPicked])); renderEvalSets(); };
  $("#setNone").onclick = () => { state.evalPicked = new Set(["all"]); lsSet(evalSetKey(), '["all"]'); renderEvalSets(); };
  await loadPromptSelectors($("#promptName"), $("#promptVersion"));
  loadPrompt();
  $("#promptName").addEventListener("prompt-changed", loadPrompt);
  $("#promptVersion").onchange = loadPrompt;

  api("/api/health").then((h) => {
    const s = $("#lfStatus");
    if (h.langfuse === true) { s.textContent = "已连接"; s.className = "badge ok"; }
    else { s.textContent = h.langfuse === null ? "未配置" : "连接失败"; s.className = "badge err"; }
  });

  // 恢复历史（带上工具卡片与 trace 入口）
  const h = await api(`/api/sessions/${state.sessionId}/history`);
  h.messages.forEach((m) => addMsg(m.role, md(m.content), { tools: m.tools, trace_id: m.trace_id,
                                                            trace_url: m.trace_url, usage: m.usage }));

  // 场景由 URL 决定：/?scenario=consult → 结构化问诊；/?scenario=rural → 山区远程问诊
  const scene = new URLSearchParams(location.search).get("scenario");
  if (scene === "consult") await enterConsult();
  if (scene === "rural") await enterRural();
  refreshAll();
}

$("#send").onclick = () => send();
// 点空白处收起「测试集合」下拉（浮层不要一直挡在按钮上）
document.addEventListener("click", (e) => {
  document.querySelectorAll("details.set-picker[open]").forEach((d) => {
    if (!d.contains(e.target)) d.open = false;
  });
});
$("#input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$("#input").addEventListener("input", (e) => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; });
document.querySelectorAll("#empty .chips button").forEach((b) => (b.onclick = () => send(b.textContent)));
$("#newSession").onclick = () => newSession();
$("#histSelect").onclick = () => setHistSelect(!state.histSelect);
$("#histCancel").onclick = () => setHistSelect(false);
$("#histDelete").onclick = deleteSelected;
$("#histAll").onclick = () => {
  const ids = [...$("#histList").querySelectorAll(".hist-item")].map((el) => el.dataset.sid);
  // 本页全选 / 取消全选
  const allPicked = ids.length && ids.every((id) => state.histSelected.has(id));
  ids.forEach((id) => (allPicked ? state.histSelected.delete(id) : state.histSelected.add(id)));
  refreshHistory();
};
// 新会话：清空消息区并换一个 session id（问诊场景会重新给出引导语）
function newSession() {
  // 先换会话 id（带兜底），再清消息区与进度条——否则新会话会看起来“没反应”，
  // 界面上还是上一个会话的状态与提示语（真实踩过）
  setSession(newSessionId());
  state.histSelected = new Set();
  $("#messages").innerHTML = '<div class="empty" id="empty"><h2>新会话已开始</h2></div>';
  refreshPptFlow(); refreshConsultFlow(); refreshRuralFlow();
  if (isConsult()) enterConsult();
  if (isRural()) enterRural();
  if (document.querySelector(".app").classList.contains("with-right")) refreshHistory();
}

$("#loadPrompt").onclick = loadPrompt;
$("#savePrompt").onclick = async () => {
  const text = $("#promptOverride").value.trim();
  if (!text) return alert("提示词为空");
  const publish = confirm("保存为新版本。\n\n确定 = 同时打上 production 标签（立即对线上生效）\n取消 = 只保存为新版本（不发布）");
  const msg = prompt("提交说明（可选）", "") ?? "";
  try {
    const r = await api(`/api/prompts/${encodeURIComponent($("#promptName").value)}`, {
      method: "POST", body: JSON.stringify({ prompt: text, labels: publish ? ["production"] : [], commit_message: msg || null }),
    });
    $("#promptInfo").textContent = `已保存 v${r.version} labels=${r.labels.join(",")}`;
    await loadPromptSelectors($("#promptName"), $("#promptVersion"));
  } catch (e) { alert("保存失败: " + e.message); }
};
init();
</script>
